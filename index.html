<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f3f6" />
    <meta
      name="description"
      content="Your bank cashbacks, beautifully together. Private, on-device screenshot recognition. No account needed."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Banker" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" href="./icons/banker.svg" type="image/svg+xml" />
    <title>Banker — cashback, together</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"></dialog>
    <input
      id="screenshot"
      type="file"
      accept="image/png,image/jpeg,image/webp,image/bmp"
      hidden
    />
    <input
      id="import-file"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
